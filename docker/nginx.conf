server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets buildés par Vite (hash dans le nom de fichier) : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Route SPA (vue-router en mode history) : toute URL inconnue retombe
    # sur index.html, le routeur côté client prend le relais (page 404 incluse).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
